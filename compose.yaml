services:
  app:
    build:
      context: .
      target: development
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27.5-bookworm
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: apk_apps
      POSTGRES_USER: apk_apps
      POSTGRES_PASSWORD: apk_apps_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apk_apps -d apk_apps"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
