services:
  app:
    build:
      context: .
      target: production
    env_file:
      - path: .env
        required: true
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: nginx-production
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-apk_apps}
      POSTGRES_USER: ${DB_USERNAME:-apk_apps}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-apk_apps} -d ${DB_DATABASE:-apk_apps}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  app_storage:
